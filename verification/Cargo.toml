[package]
name = "wave_field_verification"
version = "0.1.0"
edition = "2021"
description = "Physics verification suite for DWARF architectural proposals — superseded by dwarf_filter CLI"

[dependencies]
rustfft     = "6"
num-complex = "0.4"
rand        = "0.8"
rand_distr  = "0.4"
rayon       = "1"
serde_json  = "1"
serde       = { version = "1", features = ["derive"] }
clap        = { version = "4", features = ["derive"] }

[[bin]]
name = "dwarf_filter"
path = "src/bin/dwarf_filter.rs"

[[bin]]
name = "se096_derivation"
path = "legacy/se096_derivation.rs"

[[bin]]
name = "ramanujan_offset_search"
path = "legacy/ramanujan_offset_search.rs"

[[bin]]
name = "triadic_spectral_analysis"
path = "legacy/triadic_spectral_analysis.rs"

[[bin]]
name = "batch01_triadic_spectral"
path = "src/bin/batch01_triadic_spectral.rs"

[[bin]]
name = "batch02_dsrg_fixed_j"
path = "src/bin/batch02_dsrg_fixed_j.rs"

[[bin]]
name = "batch03_se015_baseline"
path = "src/bin/batch03_se015_baseline.rs"

[[bin]]
name = "spectral_gap_scaling"
path = "legacy/spectral_gap_scaling.rs"

[[bin]]
name = "triadic_gate_saturation_check"
path = "legacy/triadic_gate_saturation_check.rs"

[[bin]]
name = "batch01_dsr_layer_prior"
path = "src/bin/batch01_dsr_layer_prior.rs"

[[bin]]
name = "batch01_offset_space"
path = "src/bin/batch01_offset_space.rs"

[[bin]]
name = "batch01_scale_embed"
path = "src/bin/batch01_scale_embed.rs"

[[bin]]
name = "batch01_knob_interactions"
path = "src/bin/batch01_knob_interactions.rs"

[[bin]]
name = "batch01_movt_prior"
path = "src/bin/batch01_movt_prior.rs"

[[bin]]
name = "batch01_hop_reachability"
path = "src/bin/batch01_hop_reachability.rs"

[[bin]]
name = "batch01_softmax_gain"
path = "src/bin/batch01_softmax_gain.rs"
